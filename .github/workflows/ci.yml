name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database:
    name: Secrets + Supabase + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22          # F1: vitest/jsdom تتطلب Node 22+
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - run: npm ci

      - name: Secret scan
        run: npm run check:secrets

      - name: Start Supabase (db + auth + api)
        # gotrue و kong و postgrest تبقى: auth.users يُنشئه gotrue، واختبارات Auth تمر عبر kong
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta

      - name: Apply migrations from scratch
        # الاختبارات لا تعتمد على seed.sql (B8 §8.3) — قاعدة بيانات نظيفة
        run: npx supabase db reset --no-seed

      - name: pgTAP
        run: npx supabase test db

      - name: Restore test — clean schema (E6)
        # backup كامل ← قاعدة جديدة ← restore ← بصمة مطابقة ← الحزمة كاملة على النسخة المستعادة
        run: bash scripts/restore-test.sh --run-tests

      - name: Development seed (self-verifying, E5)
        # seed.sql يمر بمسار التطبيق نفسه ويتحقق من نفسه في آخره؛ أي انحراف يُفشل الخطوة
        run: npx supabase db reset

      - name: Restore test — seeded data (E6)
        # البيانات: عدد وhash كل جدول + حسابات Auth + التسلسلات تطابق المصدر بعد الاستعادة
        run: bash scripts/restore-test.sh

      - name: API security tests (F4)
        # FastAPI ← authenticator ← RLS على seed E5؛ المتغيرات من `supabase status` داخل conftest
        working-directory: services/api
        # 2B-4 (B6/E10): خدمة Storage لا تعمل في CI ← اختبارات `storage` مستبعدة صراحةً ويُعلنها الملخص (EXCLUDED)؛
        # كل اختبارات DB/الأمن/الـAPI غير المعتمدة على Storage إلزامية هنا. Excluded ≠ skipped.
        run: |
          pip install -r requirements.txt
          echo "::notice title=Storage tests excluded::Storage integration tests (pytest -m storage) are excluded in CI — the Storage service is not started here (B6/E10). They run locally with storage-api."
          python -m pytest -m "not storage"

      - name: Web — install (F1)
        working-directory: apps/web
        run: npm ci

      - name: Web — lint, typecheck, unit (F1)
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Web — production build (F1/F3)
        # F3: السياق من الـhost؛ البناء يشترط النطاق الأساسي (build-guard) — لا أداة سياق تطوير في أي بناء
        working-directory: apps/web
        env:
          VITE_BASE_DOMAIN: smas.example
        run: npm run build

      - name: Web — browser E2E (F1)
        # FastAPI (uvicorn) + بناء Vite على الحزمة نفسها؛ صندوق OTP ملف في .e2e/ (خارج apps/web، بلا artifacts)
        # F3: الصفحات على *.localhost ({school}.{tenant}، {tenant}، admin) — Chromium يحلها إلى loopback
        working-directory: apps/web
        env:
          E2E_PYTHON: python
        run: |
          npx playwright install --with-deps chromium
          echo "::notice title=Storage E2E excluded::Browser tests tagged @storage are excluded in CI — no Storage service here (B6/E10). They run locally with storage-api."
          npx playwright test --grep-invert @storage
