name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database:
    name: Secrets + Supabase + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - run: npm ci

      - name: Secret scan
        run: npm run check:secrets

      - name: Start Supabase (db + auth + api)
        # gotrue و kong و postgrest تبقى: auth.users يُنشئه gotrue، واختبارات Auth تمر عبر kong
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta

      - name: Apply migrations from scratch
        # الاختبارات لا تعتمد على seed.sql (B8 §8.3) — قاعدة بيانات نظيفة
        run: npx supabase db reset --no-seed

      - name: pgTAP
        run: npx supabase test db

      - name: Restore test — clean schema (E6)
        # backup كامل ← قاعدة جديدة ← restore ← بصمة مطابقة ← الحزمة كاملة على النسخة المستعادة
        run: bash scripts/restore-test.sh --run-tests

      - name: Development seed (self-verifying, E5)
        # seed.sql يمر بمسار التطبيق نفسه ويتحقق من نفسه في آخره؛ أي انحراف يُفشل الخطوة
        run: npx supabase db reset

      - name: Restore test — seeded data (E6)
        # البيانات: عدد وhash كل جدول + حسابات Auth + التسلسلات تطابق المصدر بعد الاستعادة
        run: bash scripts/restore-test.sh

      - name: API security tests (F4)
        # FastAPI ← authenticator ← RLS على seed E5؛ المتغيرات من `supabase status` داخل conftest
        working-directory: services/api
        run: |
          pip install -r requirements.txt
          python -m pytest
